<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title id="page-title">الدفع الإلكتروني</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="icon" href="banner.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="translations.js"></script>
  <style>
    .payment-container {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      min-height: 100vh;
      background: #f4f6f9;
    }
    
    .payment-card {
      width: 100%;
      max-width: 650px;
      padding: 48px;
      border-radius: 22px;
      background: white;
      box-shadow: 0 24px 50px rgba(0,0,0,0.12);
      text-align: center;
    }
    
    .payment-card h1 {
      margin: 0 0 32px 0;
      font-size: 2.4rem;
      color: #004080;
      font-weight: 700;
    }
    
    .invoice-section {
      background: #f7f9fc;
      border: 2px solid #e8ecf1;
      border-radius: 14px;
      padding: 32px;
      margin-bottom: 32px;
      text-align: right;
    }
    
    .invoice-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-direction: row-reverse;
      padding: 16px 0;
      font-size: 1.12rem;
      color: #333;
      border-bottom: 1px solid #e0e0e0;
    }
    
    .invoice-row:last-of-type {
      border-bottom: none;
    }
    
    .invoice-label {
      font-weight: 600;
      color: #555;
      font-size: 1rem;
      text-align: right;
      flex: 0 0 auto;
    }
    
    .invoice-value {
      font-weight: 600;
      color: #1f305d;
      font-size: 1.08rem;
      text-align: left;
      flex: 1 1 auto;
    }
    
    .invoice-row.total-row {
      padding: 18px 0;
      border-top: 2px solid #e0e0e0;
      border-bottom: 2px solid #e0e0e0;
      margin-top: 20px;
    }
    
    .total-row .invoice-label {
      font-size: 1.3rem;
      font-weight: 700;
      color: #004080;
    }
    
    .total-row .invoice-value {
      font-size: 1.45rem;
      font-weight: 700;
      color: #ff9800;
      background: rgba(255, 152, 0, 0.12);
      padding: 12px 18px;
      border-radius: 10px;
    }
    
    .pay-button {
      width: 100%;
      padding: 18px;
      margin-top: 24px;
      background: #004080;
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .pay-button:hover {
      background: #0066cc;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 64, 128, 0.3);
    }
    
    .back-button {
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      background: #f0f4f8;
      color: #004080;
      border: 1px solid #d6e4f5;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .back-button:hover {
      background: #d6e4f5;
    }
  </style>
</head>
<body>
  <header style="background: #004080; color: white; padding: 20px; display: flex; justify-content: space-between; align-items: center;">
    <h2 id="payment-title" style="margin: 0; font-size: 1.8rem; flex: 1;">الدفع الإلكتروني</h2>
    <button class="lang-toggle-btn" id="lang-btn" style="background: #ff9800; color: white; border: none; padding: 10px 18px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 0.95rem;">English</button>
  </header>
  
  <div class="payment-container">
    <div class="payment-card">
      <div class="invoice-section">
        <div class="invoice-row">
          <span class="invoice-value" id="chosen-time">...</span>
          <span class="invoice-label" id="label-time">Booking Time:</span>
        </div>
        
        <div class="invoice-row">
          <span class="invoice-value" id="chosen-date">...</span>
          <span class="invoice-label" id="label-date">Booking Date:</span>
        </div>
        
        <div class="invoice-row">
          <span class="invoice-value" id="chosen-duration">...</span>
          <span class="invoice-label" id="label-duration">Duration:</span>
        </div>
        
        <div class="invoice-row">
          <span class="invoice-value" id="price-per-hour">6 KWD</span>
          <span class="invoice-label" id="label-price-per-hour">Price per Hour:</span>
        </div>
        
        <div class="invoice-row total-row">
          <span class="invoice-value" id="total-price">...</span>
          <span class="invoice-label" id="label-total">Total Price:</span>
        </div>
      </div>
      
      <button type="button" class="pay-button" id="pay-now-btn">Pay via WhatsApp</button>
      <button type="button" class="back-button" id="back-button" onclick="window.history.back()">Back to Booking</button>
    </div>
  </div>

  <script>
    // Add event listener to language button
    const langBtn = document.getElementById("lang-btn");
    if (langBtn) {
      langBtn.addEventListener("click", function() {
        changeLanguage(getCurrentLanguage() === "ar" ? "en" : "ar");
      });
    }
    
    // Initialize translations and page direction
    updatePageDirection();
    
    // Update language button
    if (langBtn) {
      langBtn.textContent = getCurrentLanguage() === "ar" ? "English" : "العربية";
    }
    
    // Update page title
    const pageTitle = document.getElementById("page-title");
    if (pageTitle) {
      pageTitle.textContent = t("electronicPayment");
    }
    
    const paymentTitle = document.getElementById("payment-title");
    if (paymentTitle) {
      paymentTitle.textContent = t("electronicPayment");
    }
    
    // Get parameters
    const params = new URLSearchParams(window.location.search);
    const chosenTime = params.get("start") || "Unknown";
    const chosenDate = params.get("date") || "Unknown";
    const hours = parseInt(params.get("hours")) || 1;

    // Set values
    document.getElementById("chosen-time").textContent = chosenTime;
    document.getElementById("chosen-date").textContent = chosenDate;
    
    // Update labels
    document.getElementById("label-time").textContent = t("bookingTime");
    document.getElementById("label-date").textContent = t("bookingDate");
    document.getElementById("label-duration").textContent = t("duration");
    document.getElementById("label-price-per-hour").textContent = t("pricePerHour");
    document.getElementById("label-total").textContent = t("totalPrice");
    
    const durationText = hours === 1 
      ? t("durationOneHour")
      : t("durationHours", { count: hours });
    document.getElementById("chosen-duration").textContent = durationText;
    
    const totalPrice = hours * 6;
    document.getElementById("total-price").textContent = `${totalPrice} KWD`;
    
    // Update button text
    const payButton = document.getElementById("pay-now-btn");
    if (payButton) payButton.textContent = t("payViaWhatsApp");
    
    const backButton = document.getElementById("back-button");
    if (backButton) backButton.textContent = t("backToBooking");
    
    if (payButton) {
      payButton.addEventListener("click", () => {
        const durationArabic = hours === 1 ? "ساعة" : `${hours} ساعات`;
        const lang = getCurrentLanguage();
        let message;
        
        if (lang === "ar") {
          message = `السلام عليكم، أود حجز الساعة ${chosenTime} في تاريخ ${chosenDate} ولمدة ${durationArabic}. السعر النهائي: ${totalPrice} دينار كويتي.`;
        } else {
          message = `Hello, I would like to book at ${chosenTime} on ${chosenDate} for ${durationText}. Final price: ${totalPrice} KWD.`;
        }
        
        const encodedText = encodeURIComponent(message);
        const whatsappUrl = `https://wa.me/96550933933?text=${encodedText}`;
        
        window.location.href = whatsappUrl;
      });
    }
  </script>
</body>
</html>
