<!DOCTYPE html>
<html lang="ar">
  <head>
    <meta charset="UTF-8">
    <title>جدول الحجوزات</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <img src="banner.png" alt="صورة الحجوزات" class="banner">
      <h1>جدول أوقات الحجوزات</h1>
      <p>اختر الوقت المناسب لك من الجدول أدناه</p>
    </header>

    <table id="booking-table">
      <thead>
        <tr>
          <th>الساعة</th>
          <th>الحالة</th>
          <th>اختيار</th>
        </tr>
      </thead>
      <tbody>
      </tbody>
    </table>

    <!-- قسم الصور -->
    <section class="gallery">
      <h2>مميزات المكتب</h2>
      <div class="gallery-container">
        <div class="gallery-item">
          <img src="place1.png" alt="صورة 1" class="gallery-img">
          <p class="gallery-caption">استيديو تصوير</p>
        </div>
        <div class="gallery-item">
          <img src="place2.png" alt="صورة 2" class="gallery-img">
          <p class="gallery-caption">جلسة استشارية</p>
        </div>
        <div class="gallery-item">
          <img src="place3.png" alt="صورة 3" class="gallery-img">
          <p class="gallery-caption">ورشة تعلمية</p>
        </div>
      </div>
    </section>

    <script src="script.js"></script>
  </body>
</html>
